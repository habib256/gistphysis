<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Ajout de la balise viewport pour les affichages mobiles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orbitarium</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Styles de base */
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            font-family: 'Arial', sans-serif;
            /* Application plein écran au doigt : pas de zoom ni de défilement de la page
               (le pincement est géré par l'application), pas de sélection de texte,
               pas de menu ni de loupe sur appui long, pas de surbrillance au toucher. */
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            display: block;
            touch-action: none;
            cursor: grab;
        }
        canvas.glisse {
            cursor: grabbing;
        }

        /* Styles communs pour les contrôles */
        .control-panel {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            padding: 15px;
            margin: 10px;
        }

        /* Styles des boutons et contrôles */
        button, select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            /* Cible confortable pour un doigt (au moins 44 px). */
            min-height: 48px;
            touch-action: manipulation;
        }

        button:focus-visible, select:focus-visible, summary:focus-visible {
            outline: 3px solid #ffd54a;
            outline-offset: 2px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        select {
            width: 100%;
            margin: 5px 0;
        }

        /* Style pour les details/summary */
        details {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            margin-bottom: 5px;
        }

        summary {
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Grille responsive pour les checkboxes */
        .trace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 4px 10px;
            padding: 4px 10px;
        }

        /* Chaque case à cocher se coche en touchant toute la ligne (44 px de haut). */
        .trace-item {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            cursor: pointer;
        }

        .trace-item input {
            width: 22px;
            height: 22px;
            margin: 0;
            flex: none;
            accent-color: #ffd54a;
        }

        /* Boutons du temps sur une seule ligne, chacun à moitié de la largeur. */
        #timeControls button {
            flex: 1;
            white-space: nowrap;
            padding-left: 10px;
            padding-right: 10px;
        }

        /* Panneau Options : largeur limitée, défilement interne s'il ne tient pas en hauteur. */
        #optionsControls[open] {
            width: min(560px, calc(100vw - 50px));
            box-sizing: border-box;
        }

        .options-contenu {
            margin-top: 10px;
            max-height: calc(100vh - 290px);
            min-height: 120px;
            overflow-y: auto;
            touch-action: pan-y;
            overscroll-behavior: contain;
        }

        .options-boutons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        details.aide {
            background: transparent;
            margin: 6px 0 0;
        }

        details.aide summary {
            padding: 0 4px;
            min-height: 44px;
            line-height: 44px;
            font-size: 16px;
            touch-action: manipulation;
        }

        .aide-gestes {
            margin: 8px 0 0;
            padding-left: 20px;
            font-size: 14px;
            line-height: 1.5;
            color: #ddd;
        }

        /* Media queries pour le responsive */
        @media (max-width: 768px) {
            button, select {
                font-size: 14px;
                padding: 8px 16px;
            }
            label {
                font-size: 14px;
            }
            
            .control-panel {
                padding: 10px;
            }
        }

        /* Réduire la taille du bouton Options quand il est fermé */
        #optionsControls:not([open]) {
            padding: 0 !important;
            margin: 10px;
            background: transparent;
            border: none;
        }

        /* Réduction du bouton Options */
        #optionsControls > summary {
            padding: 6px 12px !important;
            font-size: 21px !important;
            min-height: 48px;
            box-sizing: border-box;
            line-height: 34px;
            touch-action: manipulation;
            cursor: pointer;
            display: inline-block;
            width: auto;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        /* Masquer le marqueur par défaut du summary */
        #optionsControls > summary::-webkit-details-marker {
            display: none;
        }

        /* Style pour les options du select pour assurer le contraste */
        select option {
            background-color: black; /* Fond sombre */
            color: white;           /* Texte blanc */
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        .share-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .share-option {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #f0f0f0;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .share-option:hover {
            background: #e0e0e0;
        }

        .modal-content {
            background-color: #1a1a1a;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close {
            color: #aaa;
        }

        .close:hover {
            color: white;
        }
    </style>
</head>
<body>
    <!-- Menu principal -->
    <div id="menu" class="control-panel" style="position: absolute; top: 10px; left: 10px; z-index: 100; width: 250px; max-width: calc(100vw - 50px);">
        <label for="planetSelect">🎯 Centrer sur :</label>
        <select id="planetSelect">
            <!-- Affiché quand la vue a été déplacée au doigt ou à la souris -->
            <option value="libre" disabled hidden>🖐️ Vue libre</option>
            <option value="soleil">☀️ Soleil</option>
            <option value="Mercure">💫 Mercure</option>
            <option value="Vénus">🌟 Vénus</option>
            <option value="Terre">🌍 Terre</option>
            <option value="Mars">🔴 Mars</option>
            <option value="Jupiter">🌐 Jupiter</option>
            <option value="Saturne">🪐 Saturne</option>
            <option value="Uranus">⭐ Uranus</option>
            <option value="Neptune">💫 Neptune</option>
            <option value="Pluton">✨ Pluton</option>
            <option value="Comète HALLEY">☄️ Comète HALLEY</option>
        </select>
        
        <!-- Contrôles du temps -->
        <div id="timeControls" style="margin-top: 10px; display: flex; gap: 10px;">
            <button id="slowTime">⏪ Ralentir</button>
            <button id="fastTime">⏩ Accélérer</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <!-- Scripts -->
    <script src="canvas.js"></script>
    <script src="controls.js"></script>
    <script src="traces.js"></script>
    <script src="planets.js"></script>
    <script src="drawing.js"></script>
    <script src="animation.js"></script>
    <script src="simulation.js"></script>

    <!-- Contrôles du bas fusionnés -->
    <div id="bottomControls" style="position: fixed; bottom: 10px; left: 10px; z-index: 1000;">
        <details id="optionsControls" class="control-panel">
            <summary>⚙️ Options</summary>
            <div class="options-contenu">
                <!-- Section Masquage -->
                <div>
                    <h3 style="margin: 0 0 5px 0; font-size: 16px;">🎭 Masquage</h3>
                    <div class="options-boutons">
                        <button id="toggleFullscreen">⛶ Plein écran</button>
                        <button id="toggleOrbits">🌠 Orbites</button>
                        <button id="toggleNames">📝 Noms</button>
                    </div>
                </div>
                <!-- Section Traces -->
                <div>
                    <h3 style="margin: 0 0 5px 0; font-size: 16px;">✏️ Traces</h3>
                    <div class="trace-grid">
                        <label class="trace-item"><input type="checkbox" id="traceSoleil">☀️ Soleil</label>
                        <label class="trace-item"><input type="checkbox" id="traceLune">🌙 Lune</label>
                        <label class="trace-item"><input type="checkbox" id="traceHalley">☄️ Halley</label>
                        <label class="trace-item"><input type="checkbox" id="traceMercure">💫 Mercure</label>
                        <label class="trace-item"><input type="checkbox" id="traceVenus">🌟 Vénus</label>
                        <label class="trace-item"><input type="checkbox" id="traceTerre">🌍 Terre</label>
                        <label class="trace-item"><input type="checkbox" id="traceMars">🔴 Mars</label>
                        <label class="trace-item"><input type="checkbox" id="traceJupiter">🌐 Jupiter</label>
                        <label class="trace-item"><input type="checkbox" id="traceSaturne">🪐 Saturne</label>
                        <label class="trace-item"><input type="checkbox" id="traceUranus">⭐ Uranus</label>
                        <label class="trace-item"><input type="checkbox" id="traceNeptune">💫 Neptune</label>
                        <label class="trace-item"><input type="checkbox" id="tracePluton">✨ Pluton</label>
                    </div>
                </div>
                <!-- Section Commandes (repliée pour ne pas masquer le système) -->
                <details class="aide">
                    <summary>👆 Commandes</summary>
                    <ul class="aide-gestes">
                        <li>Glisser (doigt ou souris) : déplacer la vue.</li>
                        <li>Pincer à deux doigts ou molette : zoomer.</li>
                        <li>Toucher ou cliquer un astre : le suivre au centre.</li>
                        <li>Toucher deux fois le fond ou choisir « Soleil » : revoir tout le système.</li>
                    </ul>
                </details>
            </div>
        </details>
    </div>

    <!-- Plein écran -->
    <script>
        // Bouton pour le plein écran, spécialement utile sur mobile/tablette
        document.getElementById('toggleFullscreen').addEventListener('click', function() {
            const docElm = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (docElm.requestFullscreen) {
                    // Refus possible (iframe sans autorisation) : on l'ignore sans erreur.
                    const demande = docElm.requestFullscreen();
                    if (demande && demande.catch) demande.catch(() => {});
                } else if (docElm.mozRequestFullScreen) { /* Firefox */
                    docElm.mozRequestFullScreen();
                } else if (docElm.webkitRequestFullscreen) { /* Chrome, Safari, Opera */
                    docElm.webkitRequestFullscreen();
                } else if (docElm.msRequestFullscreen) { /* IE/Edge */
                    docElm.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });
    </script>

    <!-- Masquer le bouton plein écran si en mode natif Capacitor -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Masquer aussi le bouton quand le plein écran est impossible
        // (iPhone, iframe sans autorisation « fullscreen »).
        const pleinEcranPossible = document.fullscreenEnabled || document.webkitFullscreenEnabled;
        // Vérifier si l'objet Capacitor existe et si la plateforme est native
        if (!pleinEcranPossible || (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform())) {
          const fullscreenButton = document.getElementById('toggleFullscreen');
          if (fullscreenButton) {
            fullscreenButton.style.display = 'none'; 
          }
        }
      });
    </script>
</body>
</html>
